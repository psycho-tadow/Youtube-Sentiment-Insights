name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:

  # =========================
  # CONTINUOUS INTEGRATION
  # =========================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      # Checkout latest code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      # Check Dockerfile
      - name: Check Dockerfile
        run: |
          echo "===== CURRENT COMMIT ====="
          git log -1 --oneline

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== DOCKERFILE CONTENTS ====="
          cat Dockerfile

          echo "===== DOCKERFILE LOCATIONS ====="
          find . -name Dockerfile -print

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run DVC pipeline
      - name: Run DVC Pipeline
        run: |
          dvc repro

      # Run tests
      - name: Run Tests
        run: |
          pytest -v


  # =========================
  # CONTINUOUS DELIVERY
  # =========================
  Continuous-Delivery:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:

      # Checkout latest code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Check exactly which Dockerfile is being used
      - name: Verify Dockerfile
        run: |
          echo "===== CURRENT COMMIT ====="
          git log -1 --oneline

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== DOCKERFILE ====="
          cat Dockerfile

          echo "===== ALL DOCKERFILES ====="
          find . -name Dockerfile -print

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Build Docker image
      - name: Build a Docker container
        run: |
          docker build -t youtube-sentiment .

      # Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag youtube-sentiment:latest \
          ${{ steps.login-ecr.outputs.registry }}/youtube-sentiment:latest

      # Push Docker image to ECR
      - name: Push Docker Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/youtube-sentiment:latest